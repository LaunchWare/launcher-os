name: PR

on:
  pull_request:
  push:
    branches: [main]

# Another push to the same PR makes the run in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Advisory. Every fast-moving input here pins its own nixpkgs on purpose
      # (see the comment in flake.nix), which is exactly the shape this action
      # objects to, so it reports without failing the job.
      - name: flake.lock hygiene
        uses: DeterminateSystems/flake-checker-action@v14
        with:
          fail-mode: false

      # --no-build is deliberate, not caution. The desktop closure is ~23.5 GiB
      # and a GitHub-hosted runner has ~14 GiB of disk, so nothing in CI may
      # reach for system.build.toplevel. Evaluation is the ceiling here; the
      # build happens on the machine that is going to run it.
      - name: Evaluate every flake output
        run: nix flake check --no-build --show-trace

      # Byte-for-byte what .githooks/pre-push runs, so CI and the hooks cannot
      # drift into disagreeing about what "conforms" means.
      - name: Repository gates and host evaluation
        run: nix run .#check -- --full
